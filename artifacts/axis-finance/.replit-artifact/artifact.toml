kind = "web"
previewPath = "/"
title = "Axis Finance"
version = "1.0.0"
id = "artifacts/axis-finance"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24980

[services.development]
run = "pnpm --filter @workspace/axis-finance run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/axis-finance", "run", "build" ]
serve = "static"
publicDir = "artifacts/axis-finance/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24980"
BASE_PATH = "/"
